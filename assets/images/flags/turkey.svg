<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Turkish Flag — exact official proportions per Turkish Flag Law (2893) -->
  <rect width="1200" height="800" fill="#E30A17"/>
  <!-- White crescent: outer circle center (425,400) r=212, inner circle center (477,400) r=168 -->
  <circle cx="425" cy="400" r="212" fill="white"/>
  <circle cx="477" cy="400" r="168" fill="#E30A17"/>
  <!-- White 5-pointed star: center (583,400), circumradius=72, innerradius=29 -->
  <polygon fill="white" transform="rotate(-18 583 400)" points="
    583,328
    605.5,381.7 662.9,381.7 617.7,416.3 635.2,470 583,435.4 530.8,470 548.3,416.3 503.1,381.7 560.5,381.7
  "/>
</svg>
